<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Diting Docker Runtime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">REDMI K50 ULTRA</p>
      <h1>Docker Runtime</h1>
      <p class="subtitle">KernelSU 控制面板 / KernelSU control panel</p>
    </header>

    <section class="card status-card">
      <div class="section-title">
        <h2>状态 / Status</h2>
        <button id="refresh" class="secondary">刷新</button>
      </div>
      <pre id="status">正在读取状态…</pre>
      <div class="button-grid three">
        <button data-action="start">启动</button>
        <button data-action="stop" class="danger">停止</button>
        <button data-action="restart" class="secondary">重启</button>
      </div>
    </section>

    <section class="card">
      <h2>运行配置 / Runtime profile</h2>
      <label>
        Cgroup
        <select id="cgroup">
          <option value="v2">v2（日用推荐 / recommended）</option>
          <option value="private-v1">private-v1（兼容旧容器）</option>
        </select>
      </label>
      <label>
        网络 / Network
        <select id="network">
          <option value="isolated">isolated（默认安全）</option>
          <option value="bridge">bridge（容器独立网络）</option>
        </select>
      </label>
      <label class="switch-row">
        <span>开机自启 / Auto start</span>
        <input id="autostart" type="checkbox" checked>
      </label>
      <button id="apply">保存并重启 / Save & restart</button>
      <p class="hint">切换 Wi-Fi 与移动数据后，bridge 模式可能需要重启 Docker 以刷新 Android 策略路由。</p>
    </section>

    <section class="card">
      <h2>数据镜像 / Data image</h2>
      <label>
        目标容量（GiB，2–512）
        <input id="size" inputmode="numeric" min="2" max="512" value="8">
      </label>
      <button id="resize" class="secondary">创建或扩容 / Create or grow</button>
      <p class="hint warning">只支持扩容，不支持缩容。操作会临时停止 Docker，并在继续前检查剩余空间和 ext4 文件系统。</p>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>日志 / Logs</h2>
        <button id="logs" class="secondary">读取</button>
      </div>
      <pre id="logOutput">尚未读取日志。</pre>
    </section>

    <p id="message" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
