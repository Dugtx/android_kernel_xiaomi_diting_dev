name: Release Docker KernelSU module

on:
  push:
    tags:
      - docker-module-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Verify tag and module version agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version=//p' runtime/kernelsu/docker/module.prop)"
          [[ "$TAG" == "docker-module-v$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate and build pinned module
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          runtime/kernelsu/docker/validate-source.sh
          OUTPUT="$GITHUB_WORKSPACE/out/diting-docker-kernelsu-v$VERSION.zip" \
            runtime/kernelsu/docker/build-package.sh --download

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="out/diting-docker-kernelsu-v$VERSION.zip"
          checksum="$zip.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$checksum" --clobber
          else
            gh release create "$TAG" "$zip" "$checksum" \
              --verify-tag \
              --title "Docker Runtime KernelSU module v$VERSION" \
              --notes-file runtime/kernelsu/docker/README.md
          fi
