name: Docker KernelSU module

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/kernelsu/docker/**
      - .github/workflows/docker-module.yml

permissions:
  contents: read

concurrency:
  group: docker-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate module source
        run: runtime/kernelsu/docker/validate-source.sh

      - name: Read module version
        id: version
        run: |
          version="$(sed -n 's/^version=//p' runtime/kernelsu/docker/module.prop)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build pinned module package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUTPUT="$GITHUB_WORKSPACE/out/diting-docker-kernelsu-v$VERSION.zip" \
            runtime/kernelsu/docker/build-package.sh --download

      - name: Publish workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: diting-docker-kernelsu-${{ github.sha }}
          path: |
            out/diting-docker-kernelsu-v${{ steps.version.outputs.version }}.zip
            out/diting-docker-kernelsu-v${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
